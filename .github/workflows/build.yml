name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [SpaceTradersService, SpaceTradersUI]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ponytail: runner has Docker preinstalled, so Testcontainers works without the GitLab dind service
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
